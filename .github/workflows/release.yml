# Builds the APK and publishes it as a GitHub release.
#
# Two ways to cut a release:
#   - push a version tag:  git tag v20 && git push origin v20
#   - or run this workflow manually and type the tag (e.g. v20) — Actions then
#     creates the tag itself, which is handy where local tag pushes are refused.
#
# A manual run with the tag left blank just builds the APK and uploads it as a
# run artifact, for checking the pipeline without cutting a release.

name: Build & release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v20). Leave blank to build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need master too, for the version.json bump below

      # Collapses "tag push" and "manual run with a tag" into one value; empty
      # means build-only. Taken through env, never interpolated into the script,
      # so the input cannot inject shell.
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [ -n "$tag" ] && ! echo "$tag" | grep -qE '^v[0-9]+$'; then
            echo "::error::tag must look like v20, got '$tag'"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-<none, build only>}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"    # matches jvmToolchain(17) in app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      # The in-app updater compares version.json against APP_VERSION compiled into
      # the APK. A tag that disagrees with the source would ship a build that keeps
      # re-prompting for an update, so fail loudly here instead.
      - name: Check tag matches APP_VERSION and versionCode
        if: env.RELEASE_TAG != ''
        run: |
          tag="${RELEASE_TAG#v}"
          app=$(grep -oP 'APP_VERSION = \K\d+' app/src/main/java/com/jonis/thirty/MainActivity.kt)
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          echo "tag=$tag APP_VERSION=$app versionCode=$code"
          if [ "$tag" != "$app" ] || [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag, APP_VERSION $app, versionCode $code — all three must match"
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.RELEASE_TAG || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # Creates the tag at this commit if it does not already exist.
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Jonis 30 $RELEASE_TAG" \
            --generate-notes

      # Only once the APK is actually downloadable. Bumping version.json any earlier
      # shows every older install a forced-update dialog pointing at the previous
      # APK, which reports the old version again — an update loop with no way out.
      - name: Point the updater at the new release
        if: env.RELEASE_TAG != ''
        run: |
          ver="${RELEASE_TAG#v}"
          git checkout -B master origin/master
          sed -i "s/\"version\": [0-9]*/\"version\": $ver/" version.json
          if git diff --quiet version.json; then
            echo "version.json already at $ver — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "v$ver: point updater at the new release [skip ci]"
          git push origin master
